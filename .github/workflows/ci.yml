name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Lint diagnostic
        run: |
          ruff check . --fix || true
          git diff -- tests/test_domain_schemas.py
          exit 1

      - name: Test
        run: python -m pytest
